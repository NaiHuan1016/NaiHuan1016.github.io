<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语学习 | 奈欢yu的知识博客</title>
    <link rel="stylesheet" href="../../../CSS/style.css">
    <style>
        .topic-header {
            text-align: center;
            padding: 2rem 0;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            border-radius: 1.5rem;
            margin-bottom: 2rem;
        }
        .topic-header h1 {
            font-size: 2.5rem;
            color: var(--primary-dark);
        }
        .topic-header p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .article-item {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            border: 1px solid var(--border-card);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .article-item:hover {
            transform: translateX(6px);
            border-color: var(--primary);
        }
        .article-info h3 {
            color: var(--primary-dark);
            margin-bottom: 0.3rem;
        }
        .article-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .article-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--primary);
            text-decoration: none;
        }
        @media (max-width: 640px) {
            .article-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container nav-container">
        <div class="logo">
            <a href="../../index.html" class="logo-link">
                <img src="../../../IMAGE/avatar.jpeg" alt="头像" class="avatar">
                <span class="nickname">奈欢yu</span>
            </a>
        </div>
        <button class="menu-toggle" id="mobileMenuBtn">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="../../index.html">首页</a></li>
            <li><a href="../../topics.html">全部内容</a></li>
        </ul>
    </div>
</nav>

<main class="container">
    <a href="../../topics.html" class="back-link">← 返回全部内容</a>
    
    <div class="topic-header">
        <h1>🗾 日语学习</h1>
        <p>文法・词汇・会话・JLPT备考笔记</p>
    </div>

    <div class="article-list" id="articleList"></div>
</main>

<footer class="footer">
    <div class="container">
        <p>感谢你的阅读，愿我们都能在学习中不断进步！</p>
        <p class="copyright">© 2026 奈欢yu | 知识分享博客</p>
    </div>
</footer>

<div class="floating-buttons">
    <button class="scroll-top" id="scrollTopBtn">↑</button>
    <button class="theme-toggle" id="themeToggle">🌙</button>
</div>

<script src="../../../JS/main.js"></script>
<script>
    const japaneseArticles = [
    { title: "前言：学习指南", desc: "五十音图、书籍推荐、声调、语句组成", date: "2026-05-25", link: "intro.html" },
    { title: "第一课：初対面", desc: "名词句基础・です・か・も・の", date: "2026-05-25", link: "lesson1.html" },
    { title: "第二课：これ・それ・あれ", desc: "指示代词・この・その・あの・选择疑问", date: "2026-05-26", link: "lesson2.html" },
    { title: "第三课：ここ・そこ・あそこ", desc: "场所指示・こちら・そちら・あちら・产地询问", date: "2026-05-27", link: "lesson3.html" },
    { title: "第四课：時間・動詞ます形", desc: "动词时态・时间表达・に・から～まで・と・ね", date: "2026-05-28", link: "lesson4.html" },
    { title: "第五课：方向・交通・一緒に", desc: "移动方向・交通工具・一起行动・よ・そうですね", date: "2026-05-29", link: "lesson5.html" },
    { title: "第六课：動作の対象・場所", desc: "他动词・をします・动作场所・邀请・ましょう", date: "2026-05-29", link: "lesson6.html" },
    { title: "第七课：授受・手段・完了", desc: "授受动词・手段で・もう〜ました・助词省略", date: "2026-05-30", link: "lesson7.html" },
    { title: "第八课：形容詞", desc: "な形容詞・い形容詞・修饰・とても/あまり・どんな", date: "2026-05-30", link: "lesson8.html" },
    { title: "第九课：好き・能力・原因", desc: "喜好/能力用が・程度副词・から・どうして", date: "2026-05-31", link: "lesson9.html" },
    { title: "第十课：存在・位置・列举", desc: "あります/います・存在句・方位词・や列举", date: "2026-05-31", link: "lesson10.html" },
    { title: "第十一课：量詞・頻度・だけ", desc: "量词・频率基准に・どのぐらい・だけ", date: "2026-06-01", link: "lesson11.html" },
    { title: "第十二课：形容詞の時態・比較", desc: "形容词过去形・より・どちら・一番・の", date: "2026-06-01", link: "lesson12.html" },
    { title: "第十三课：欲しい・たい・目的", desc: "愿望・欲しい/たい・目的に・どこか/何か", date: "2026-06-04", link: "lesson13.html" },
    { title: "第十四课：動詞て形・ています", desc: "动词分类・て形・てください・ています", date: "2026-06-04", link: "lesson14.html" },
    { title: "第十五课：許可・禁止・状態", desc: "许可てもいい・禁止てはいけない・状态ています", date: "2026-06-05", link: "lesson15.html" },
    { title: "第十六课：て形接続・てから", desc: "て形顿挫・てから顺序・どうやって", date: "2026-06-05", link: "lesson16.html" },
    { title: "第十七课：ない形・禁止・義務", desc: "ない形・禁止・义务・不必要・までに", date: "2026-06-06", link: "lesson17.html" },
    { title: "第十八课：辞書形・能力・趣味", desc: "辞书形・ことができます・趣味・前に", date: "2026-06-06", link: "lesson18.html" },
    { title: "第十九课：た形・経験・変化", desc: "た形・たことがある・たり～たり・くなる/になる", date: "2026-06-06", link: "lesson19.html" }
];

    function renderArticleList() {
        const container = document.getElementById('articleList');
        if (!container) return;
        let html = '';
        japaneseArticles.forEach(article => {
            html += `
                <div class="article-item" data-link="${article.link}">
                    <div class="article-info">
                        <h3>📖 ${article.title}</h3>
                        <p>${article.desc}</p>
                    </div>
                    <div class="article-date">📅 ${article.date.replace(/-/g, '/')}</div>
                </div>
            `;
        });
        container.innerHTML = html;
        document.querySelectorAll('.article-item').forEach(item => {
            item.addEventListener('click', () => {
                const link = item.getAttribute('data-link');
                if (link) window.location.href = link;
            });
        });
    }
    renderArticleList();
</script>
</body>
</html>
