<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日语学习 | 奈欢yu的知识博客</title>
    <link rel="stylesheet" href="../../../CSS/style.css">
    <style>
        .topic-header {
            text-align: center;
            padding: 2rem 0;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            border-radius: 1.5rem;
            margin-bottom: 2rem;
        }
        .topic-header h1 {
            font-size: 2.5rem;
            color: var(--primary-dark);
        }
        .topic-header p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .article-item {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            border: 1px solid var(--border-card);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .article-item:hover {
            transform: translateX(6px);
            border-color: var(--primary);
        }
        .article-info h3 {
            color: var(--primary-dark);
            margin-bottom: 0.3rem;
        }
        .article-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .article-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--primary);
            text-decoration: none;
        }
        @media (max-width: 640px) {
            .article-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container nav-container">
        <div class="logo">
            <a href="../../index.html" class="logo-link">
                <img src="../../../IMAGE/avatar.jpeg" alt="头像" class="avatar">
                <span class="nickname">奈欢yu</span>
            </a>
        </div>
        <button class="menu-toggle" id="mobileMenuBtn">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="../../index.html">首页</a></li>
            <li><a href="../../topics.html">全部内容</a></li>
        </ul>
    </div>
</nav>

<main class="container">
    <a href="../../../topics.html" class="back-link">← 返回全部内容</a>
    
    <div class="topic-header">
        <h1>🗾 日语学习</h1>
        <p>文法・词汇・会话・JLPT备考笔记</p>
    </div>

    <div class="article-list" id="articleList"></div>
</main>

<footer class="footer">
    <div class="container">
        <p>感谢你的阅读，愿我们都能在学习中不断进步！</p>
        <p class="copyright">© 2025 奈欢yu | 知识分享博客</p>
    </div>
</footer>

<div class="floating-buttons">
    <button class="scroll-top" id="scrollTopBtn">↑</button>
    <button class="theme-toggle" id="themeToggle">🌙</button>
</div>

<script src="../../../JS/main.js"></script>
<script>
    const japaneseArticles = [
    { title: "前言：学习指南", desc: "五十音图、书籍推荐、声调、语句组成", date: "2025-05-25", link: "intro.html" },
    { title: "第一课：初対面", desc: "名词句基础・です・か・も・の", date: "2025-05-25", link: "lesson1.html" },
    { title: "第二课：これ・それ・あれ", desc: "指示代词・この・その・あの・选择疑问", date: "2025-05-26", link: "lesson2.html" },
    { title: "第三课：ここ・そこ・あそこ", desc: "场所指示・こちら・そちら・あちら・产地询问", date: "2025-05-27", link: "lesson3.html" },
    { title: "第四课：時間・動詞ます形", desc: "动词时态・时间表达・に・から～まで・と・ね", date: "2025-05-28", link: "lesson4.html" },
    { title: "第五课：方向・交通・一緒に", desc: "移动方向・交通工具・一起行动・よ・そうですね", date: "2025-05-29", link: "lesson5.html" },
    { title: "第六课：動作の対象・場所", desc: "他动词・をします・动作场所・邀请・ましょう", date: "2025-05-29", link: "lesson6.html" }
];

    function renderArticleList() {
        const container = document.getElementById('articleList');
        if (!container) return;
        let html = '';
        japaneseArticles.forEach(article => {
            html += `
                <div class="article-item" data-link="${article.link}">
                    <div class="article-info">
                        <h3>📖 ${article.title}</h3>
                        <p>${article.desc}</p>
                    </div>
                    <div class="article-date">📅 ${article.date.replace(/-/g, '/')}</div>
                </div>
            `;
        });
        container.innerHTML = html;
        document.querySelectorAll('.article-item').forEach(item => {
            item.addEventListener('click', () => {
                const link = item.getAttribute('data-link');
                if (link) window.location.href = link;
            });
        });
    }
    renderArticleList();
</script>
</body>
</html>
