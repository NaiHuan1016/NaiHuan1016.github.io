    <link rel="stylesheet" href="../../../CSS/style.css">
    <style>
        .topic-header {
            text-align: center;
            padding: 2rem 0;
            background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
            border-radius: 1.5rem;
            margin-bottom: 2rem;
        }
        .topic-header h1 {
            font-size: 2.5rem;
            color: var(--primary-dark);
        }
        .topic-header p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .article-item {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            border: 1px solid var(--border-card);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .article-item:hover {
            transform: translateX(6px);
            border-color: var(--primary);
        }
        .article-info h3 {
            color: var(--primary-dark);
            margin-bottom: 0.3rem;
        }
        .article-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .article-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--primary);
            text-decoration: none;
        }
        @media (max-width: 640px) {
            .article-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
    </style>
    <!-- 动画库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    { title: "第三十五课：假定形・なら", desc: "假定形（ば）・どうすれば・なら・礼貌疑问", date: "2026-06-17", link: "n5-n4/lesson35.html" },
    { title: "第三十六课：ように（目的・習慣）", desc: "目的・变得・坚持・间接请求", date: "2026-06-18", link: "n5-n4/lesson36.html" }
];

    function renderArticleList() {
        const container = document.getElementById('articleList');
        if (!container) return;
        let html = '';
        japaneseArticles.forEach(article => {
            html += `
                <div class="article-item animate__animated animate__fadeInUp" data-aos="fade-up" data-link="${article.link}">
                    <div class="article-info">
                        <h3>📖 ${article.title}</h3>
                        <p>${article.desc}</p>
                    </div>
                    <div class="article-date">📅 ${article.date.replace(/-/g, '/')}</div>
                </div>
            `;
        });
        container.innerHTML = html;
        document.querySelectorAll('.article-item').forEach(item => {
            item.addEventListener('click', () => {
                const link = item.getAttribute('data-link');
                if (link) window.location.href = link;
            });
        });
    }
    renderArticleList();
</script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,

        });
    </script>
